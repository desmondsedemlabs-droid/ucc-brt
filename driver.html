<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCC - BRT</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 420px; margin: auto; }
    select, button { width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; }
    #status { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>UCC BRT</h2>

  <label>Bus</label>
  <select id="bus">
    <option value="bus1">Bus 1</option>
    <option value="bus2">Bus 2</option>
    <option value="bus3">Bus 3</option>
  </select>

  <label>Route</label>
  <select id="route">
    <option value="src">SRC Hall</option>
    <option value="valco">Valco Hall</option>
    <option value="oldsite">Old Site</option>
  </select>

  <label>Direction</label>
  <select id="direction">
    <option value="to_swlt">To SWLT</option>
    <option value="to_hall">Back to hall</option>
  </select>

  <button id="start">Start sharing location</button>
  <button id="stop">Stop</button>

  <h3>Passengers</h3>
  <p id="count">0 / 40 seats</p>
  <button id="plus">+1 passenger</button>
  <button id="minus">−1</button>
  <button id="reset">Reset (bus emptied)</button>
  <p id="status">Not sharing</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig } from "./config.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let watchId = null;
    let lastPos = null;     // remembers the latest GPS reading
    let heartbeat = null;   // NEW: timer for the 30-second check-in
    const statusText = document.getElementById("status");
    const value = (id) => document.getElementById(id).value;

    let passengers = 0;
    const SEATS = 40, STANDING = 45;

    function countText(n) {
      return n <= SEATS ? n + " / " + SEATS + " seats" : "Seats full, " + (n - SEATS) + " standing";
    }

    function changeCount(change) {
      passengers = Math.max(0, Math.min(SEATS + STANDING, passengers + change));
      document.getElementById("count").textContent = countText(passengers);
      sendUpdate();
    }

    document.getElementById("plus").onclick = () => changeCount(1);
    document.getElementById("minus").onclick = () => changeCount(-1);
    document.getElementById("reset").onclick = () => changeCount(-passengers);

    // Sends the current bus info to Firebase
    function sendUpdate() {
      if (!lastPos) return;
      set(ref(db, "buses/" + value("bus")), {
        route: value("route"),
        direction: value("direction"),
        passengers: passengers,
        lat: lastPos.coords.latitude,
        lng: lastPos.coords.longitude,
        updated: Date.now()
      });
      statusText.textContent = "Sharing: " +
        lastPos.coords.latitude.toFixed(5) + ", " + lastPos.coords.longitude.toFixed(5);
    }

    document.getElementById("start").onclick = () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(
        (pos) => { lastPos = pos; sendUpdate(); },
        (err) => { statusText.textContent = "Location error: " + err.message; },
        { enableHighAccuracy: true }
      );
      clearInterval(heartbeat);                    // NEW
      heartbeat = setInterval(sendUpdate, 30000);  // NEW: check in every 30s, even when parked
    };

    document.getElementById("route").onchange = sendUpdate;
    document.getElementById("direction").onchange = sendUpdate;

    document.getElementById("stop").onclick = () => {
      clearInterval(heartbeat);   // NEW: stop checking in
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      remove(ref(db, "buses/" + value("bus")));
      statusText.textContent = "Stopped";
    };
  </script>
</body>
</html>
