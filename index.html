<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCC BRT - Live Buses</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    header { padding: 10px 14px; background: #1b5e20; color: white; }
    header h2 { margin: 0; font-size: 18px; }
    #map { height: calc(100vh - 42px); }
  </style>
</head>
<body>
  <header><h2>UCC BRT – Live Buses</h2></header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig } from "./config.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Name and color for each route
    const ROUTES = {
      src:     { name: "SRC Hall",   color: "#d32f2f" },  // red
      valco:   { name: "Valco Hall", color: "#1976d2" },  // blue
      oldsite: { name: "Old Site",   color: "#388e3c" }   // green
    };

    // Map centered on campus, using OpenStreetMap (free)
    const map = L.map("map").setView([5.1095, -1.3005], 15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const markers = {};  // one marker per bus
        const SEATS = 40;
    function countText(n) {
      return n <= SEATS ? n + " / " + SEATS + " seats" : "Seats full, " + (n - SEATS) + " standing";
    }

    // Builds the label, e.g. "SRC Hall → SWLT"
    function label(bus) {
      const hall = ROUTES[bus.route]?.name ?? bus.route;
      return bus.direction === "to_swlt" ? hall + " → SWLT" : "SWLT → " + hall;
    }

    // Runs every time anything under "buses" changes in Firebase
    onValue(ref(db, "buses"), (snapshot) => {
      const buses = snapshot.val() || {};

      // Remove buses that stopped sharing
      for (const id in markers) {
        if (!buses[id]) { map.removeLayer(markers[id]); delete markers[id]; }
      }

      // Add new buses, or move existing ones
      for (const id in buses) {
        const bus = buses[id];
        const color = ROUTES[bus.route]?.color ?? "#555";
        const text = label(bus) + " · " + countText(bus.passengers ?? 0);

        if (!markers[id]) {
          markers[id] = L.circleMarker([bus.lat, bus.lng], {
            radius: 10, color: "white", weight: 2, fillColor: color, fillOpacity: 1
          }).addTo(map).bindTooltip(text, { permanent: true, direction: "top", offset: [0, -10] });
        } else {
          markers[id].setLatLng([bus.lat, bus.lng]);
          markers[id].setStyle({ fillColor: color });
          markers[id].setTooltipContent(text);
        }
      }
    });
  </script>
</body>
</html>
